name: Bug report
description: Something behaves differently from how it's documented or intended.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A Dockerfile or a workflow that reproduces it is worth more
        than a description of one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true
