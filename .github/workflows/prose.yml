# The two tiers markdownlint does not cover.
#
# Layout is Prettier and structure is markdownlint, both in the ci workflow.
# Those pass a document that reads badly: neither notices "an university", "the
# the", or a product name spelled three ways.
#
# Mechanics and style are separate jobs on purpose. When this goes red the job
# name should say which tier failed, because a grammar mistake and a style
# opinion are answered differently — one is wrong, the other is a suggestion.
# Mechanics fails the build; style reports and does not.
name: prose

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - scripts/lint-*.sh
      - .github/workflows/prose.yml
  pull_request:
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - scripts/lint-*.sh
      - .github/workflows/prose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prose-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like everything else. Vale's style packages are versioned separately
  # and fetched by `vale sync`.
  VALE_VERSION: 3.17.1
  # ltex-ls-plus is pinned inside scripts/lint-mechanics.sh instead, so the hook
  # and this workflow cannot install different versions of it.

jobs:
  # Grammar, spelling, the phonetic article. These have a right answer, so this
  # one fails the build.
  mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the prose this repository owns
        # The same script the pre-push hook runs, so the two cannot disagree
        # about the version, the file list, or what counts as a failure. It
        # fetches ltex-ls-plus itself and caches it outside the repository.
        run: ./scripts/lint-mechanics.sh

  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # From the release tarball rather than `go install`: form-handler builds
      # Vale with the Go toolchain it already has for its own source, and this
      # repository has no Go in it to borrow.
      - name: Install Vale
        run: |
          set -eu
          url="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSL "$url" | sudo tar -xz -C /usr/local/bin vale
          vale --version

      - name: Vale
        # The same script the pre-push hook runs, so the two cannot check
        # different files or disagree about what is worth failing on.
        env:
          VALE_REPORT: vale.txt
        run: ./scripts/lint-prose.sh

      - name: Report
        if: always()
        run: |
          {
            echo '### Vale'
            echo
            if [ -s vale.txt ]; then
              echo '```'
              cat vale.txt
              echo '```'
            else
              echo 'Nothing to report.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
