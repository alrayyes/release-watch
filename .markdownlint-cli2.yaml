# Markdown this repo owns. There is not much of it, but the README is the first
# thing anyone reads and a broken link or a skipped heading level is exactly the
# sort of thing nobody notices while writing it.
globs:
  - "**/*.md"

ignores:
  - CHANGELOG.md # written by the release job, not by hand
  # The Contributor Covenant, verbatim. Vendored prose belongs to whoever wrote
  # it — rewrapping it to satisfy a line length here would be editing somebody
  # else's document and would make the diff against upstream useless.
  - CODE_OF_CONDUCT.md
  # Both of these are gitignored, but a glob does not know that: node_modules is
  # where the linters themselves live, and .bun-cache is where CI puts bun's
  # cache, because GitHub can only cache paths inside the project directory.
  - "**/node_modules/**"
  - "**/.bun-cache/**"
  # Vale's style packages, downloaded by `vale sync`. Somebody else's docs, held
  # to somebody else's rules.
  - "styles/Google/**"
  - "styles/proselint/**"
  # Generated by `openspec init`, not written by hand — the OpenSpec CLI's own
  # skill and command docs, held to their own format contract, not this
  # repo's house style.
  - ".claude/**"
  # OpenSpec's own template format for proposals, specs and tasks - starts
  # each file with a `## Why`/`## Purpose` heading rather than a top-level
  # `#`, and isn't meant to read as house prose. Held to OpenSpec's contract,
  # not this repo's.
  - "openspec/**"

config:
  # Rules markdownlint ships and maintains alongside Prettier itself, so
  # heading style, blanks around headings/lists, fence style, trailing
  # spaces and the rest don't second-guess a layout decision Prettier
  # already made. Re-enabling line-length below has to use the alias,
  # never a raw MD013: key - extends merges on the literal key, so a
  # stray MD013: block would sit beside the inherited line-length: false
  # and lose silently.
  extends: "markdownlint/style/prettier"
  line-length:
    # Prose stays at 80 so the diff of a reworded paragraph is the paragraph.
    line_length: 80
    # Tables and code blocks are exempt: a pinned image digest and a table row
    # cannot be wrapped, and mangling them to satisfy a number reads worse.
    tables: false
    code_blocks: false
